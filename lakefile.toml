name = "leanbf"
version = "1.0.0"
description = "Formal Lean 4 verification of the Brainfuck esolang focusing on Turing completeness"
keywords = ["math", "esolang", "formal-verification", "programming-languages"]
defaultTargets = ["LeanBF", "Tests"]
lintDriver = "batteries/runLinter"
testDriver = "Tests"

# Give Lean's worker threads a large stack so the deep kernel `decide`
# reductions (e.g. long `List.replicate` evaluations) do not overflow on CI
# runners.
moreLeanArgs = ["-s", "65536"]

[leanOptions]
pp.unicode.fun = true                 # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 5
maxHeartbeats = 400000
maxRecDepth = 20000                   # kernel `decide`/`rfl` on deep `List.replicate` evaluations

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.28.0"

[[lean_lib]]
name = "LeanBF"

[[lean_lib]]
name = "Tests"
